name: Sync from upstream

# Keeps tokenaissance/ai-berkshire current with the upstream
# xbtlin/ai-berkshire framework. Runs every 12h ("半天级").
#
# Branch architecture (our build lives on the `fastagent` branch, NOT main):
#   main      = pure mirror of upstream main (fast-forward, zero fork files)
#   fastagent = our build: meta-skill package shell + fastagent adaptation on
#               top of the mirror. After main syncs, merge main into fastagent,
#               keeping OUR side (package files) on conflict.
#
# Why: xbtlin pushes frequently. Keeping our package off main means main stays
# a clean mirror that fast-forwards forever. Our build branch carries the
# package (SKILL.md manifest.json agents/ evals/ reports/ LICENSE README.md
# docs/ .github/workflows/), so those are the only files that can conflict.

on:
  schedule:
    - cron: '17 4,16 * * *'  # 04:17 / 16:17 UTC = 12:17 / 00:17 Beijing
  workflow_dispatch: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/xbtlin/ai-berkshire.git
          git fetch upstream main

      - name: Fast-forward main (pure mirror)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          git merge --ff-only upstream/main
          git push origin main

      - name: Merge main into fastagent (keep build files on conflict)
        run: |
          git checkout -B fastagent origin/fastagent 2>/dev/null \
            || git checkout -b fastagent main
          set +e
          git merge main --no-edit > /tmp/sync-merge.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "merge clean or nothing to merge"
          elif git diff --name-only --diff-filter=U | grep -q .; then
            echo "conflicts detected; keeping our build files:"
            git diff --name-only --diff-filter=U | sed 's/^/  /'
            for f in $(git diff --name-only --diff-filter=U); do
              git checkout --ours -- "$f"
              git add -- "$f"
            done
            git commit -m "sync: merge main into fastagent, keep build files on conflict"
          else
            cat /tmp/sync-merge.log
            echo "::error::merge failed for a non-conflict reason"
            exit 1
          fi

      - name: Re-assert SKILL.example.md naming (single-root SKILL.md contract)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("codex-skills")
          renamed = []
          if root.is_dir():
              for d in sorted(root.iterdir()):
                  if not d.is_dir():
                      continue
                  src = d / "SKILL.md"
                  dst = d / "SKILL.example.md"
                  if src.exists() and not dst.exists():
                      src.rename(dst)
                      renamed.append(str(src.relative_to(".")))
          if renamed:
              print("renamed to SKILL.example.md:")
              print("\n".join("  " + r for r in renamed))
          PY
          if git diff --quiet; then
            echo "codex-skills naming already invariant"
          else
            git add codex-skills
            git commit -m "sync: re-assert SKILL.example.md naming (single-root SKILL.md contract)"
          fi

      - name: Push both branches
        run: |
          git push origin main
          git push origin fastagent
